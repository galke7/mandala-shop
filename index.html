<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מנדלות בעבודת יד</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">מנדלות בעבודת יד</div>
      <form class="search" role="search">
        <input type="search" aria-label="חיפוש מוצרים" placeholder="חיפוש..." />
      </form>
      <button class="cart-btn" aria-label="פתיחת סל הקניות">
        🛒 <span class="cart-count" data-cart-count>0</span>
      </button>
    </header>

    <section class="hero">
      <h1>מנדלות סרוגות בעבודת יד</h1>
      <p>כל פריט נסרג בהזמנה אישית באהבה</p>
      <a class="btn btn-primary" href="#products">לצפייה במוצרים</a>
    </section>

    <section id="products" class="products container">
      <div class="row g-4" id="product-grid"></div>
    </section>

    <footer class="site-footer">
      <div class="col"><h3>אודות</h3><p>מנדלות סרוגות בעבודת יד.</p></div>
      <div class="col"><h3>צרו קשר</h3><p>margalitag@gmail.com</p></div>
      <div class="col"><h3>משלוחים</h3><p>משלוח לכל הארץ.</p></div>
    </footer>

    <aside id="cart-drawer" class="cart-drawer" hidden>
      <button class="close-cart" aria-label="סגירת הסל">✕</button>
      <h2>סל הקניות</h2>
      <div id="cart-lines"></div>
      <p class="cart-grand">סה"כ: <span data-cart-grand>0</span> ₪</p>
      <a href="#order" class="btn btn-primary" id="go-to-order">למילוי הזמנה</a>
    </aside>

    <script id="cart-line-tpl" type="x-tmpl-mustache">
      <div class="cart-line" data-line-id="{{id}}">
        <span class="cart-line-name">{{name}}</span>
        <span class="cart-line-qty">x{{qty}}</span>
        <span class="cart-line-total">{{lineTotal}} ₪</span>
        <button class="btn btn-sm btn-link remove-line" data-id="{{id}}" aria-label="הסרת {{name}} מהסל">הסר</button>
      </div>
    </script>

    <script id="product-card-tpl" type="x-tmpl-mustache">
      <div class="col-6 col-md-4 col-lg-3">
        <article class="product-card">
          {{#badge}}<span class="badge bg-danger product-badge">{{badge}}</span>{{/badge}}
          <img src="{{image}}" alt="{{name}}" class="product-img" />
          <h3 class="product-name">{{name}}</h3>
          <p class="product-price">
            {{#salePrice}}<span class="old-price">{{price}} ₪</span> <strong>{{salePrice}} ₪</strong>{{/salePrice}}
            {{^salePrice}}<strong>{{price}} ₪</strong>{{/salePrice}}
          </p>
          <button class="btn btn-primary add-to-cart" data-id="{{id}}">הוסף לסל</button>
          <button class="btn btn-link quick-view" data-id="{{id}}">צפייה מהירה</button>
        </article>
      </div>
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
